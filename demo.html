<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Automation Platform for Fashion Brands — Demo</title>
<style>
/* =========================================================================
   DESIGN SYSTEM  (brand-neutral, premium B2B SaaS)
   All colors are CSS variables so a client's palette can be swapped in one place.
   ========================================================================= */
:root{
  --ink:#1b1b1d;
  --ink-2:#44454a;
  --ink-3:#73757c;
  --line:#e7e4df;
  --line-2:#efece7;
  --bg:#faf8f5;
  --surface:#ffffff;
  --surface-2:#f6f3ef;
  --brand:#2b2b2e;          /* neutral charcoal — client brand color drops in here */
  --brand-soft:#ecebe8;
  --accent:#8a6d52;         /* warm neutral accent (taupe/bronze) */
  --accent-soft:#f3ede6;
  --ok:#2f7d5b; --ok-soft:#e5f1ea;
  --warn:#b5832b; --warn-soft:#f8efdb;
  --risk:#b4442f; --risk-soft:#f8e4df;
  --info:#3a5f8a; --info-soft:#e6edf5;
  --ai:#5b4b8a; --ai-soft:#ece8f5;
  --radius:14px; --radius-sm:9px; --radius-lg:20px;
  --shadow:0 1px 2px rgba(20,18,15,.05),0 8px 24px rgba(20,18,15,.06);
  --shadow-lg:0 12px 48px rgba(20,18,15,.14);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Georgia","Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); color:var(--ink); background:var(--bg);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
::selection{background:var(--accent-soft)}
/* scrollbars */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:#d8d4ce;border-radius:20px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:#c3beb6;background-clip:content-box}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{
  background:var(--surface);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
}
.brand{display:flex;align-items:center;gap:11px;padding:20px 20px 16px}
.brand-mark{
  width:38px;height:38px;border-radius:10px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.5px;flex:none;
}
.brand-name{font-weight:700;font-size:15px;line-height:1.1}
.brand-sub{font-size:11px;color:var(--ink-3);letter-spacing:.02em}
.nav{padding:8px 12px;overflow-y:auto;flex:1}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);
  padding:14px 10px 6px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;
  padding:9px 10px;border-radius:9px;color:var(--ink-2);font-size:13.5px;font-weight:500;
  text-align:left;margin-bottom:1px;transition:background .12s,color .12s;
}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:var(--brand-soft);color:var(--ink);font-weight:600}
.nav-item svg{width:17px;height:17px;flex:none;opacity:.85}
.nav-item .count{margin-left:auto;background:var(--brand);color:#fff;font-size:10.5px;
  font-weight:600;border-radius:20px;padding:1px 7px;min-width:18px;text-align:center}
.nav-item .count.alert{background:var(--risk)}
.sidebar-foot{padding:12px 14px;border-top:1px solid var(--line)}

/* ---------- Topbar ---------- */
.main{display:flex;flex-direction:column;min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(250,248,245,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:16px;
}
.search{flex:1;max-width:420px;position:relative}
.search input{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:9px 12px 9px 34px;font-size:13px;color:var(--ink);outline:none;transition:border .12s,box-shadow .12s;
}
.search input:focus{border-color:#c9c3ba;box-shadow:0 0 0 3px var(--brand-soft)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.env-badge{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--warn);
  background:var(--warn-soft);border:1px solid #ecd9ab;padding:5px 10px;border-radius:20px;
}
.env-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--warn);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);padding:8px 13px;border-radius:9px;font-size:13px;font-weight:600;transition:all .12s;
}
.btn:hover{border-color:#cfc9c0;background:var(--surface-2)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:#000;filter:none}
.btn.sm{padding:6px 10px;font-size:12px}
.btn svg{width:15px;height:15px}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.accent:hover{filter:brightness(.94)}

/* ---------- Content ---------- */
.content{padding:26px;max-width:1280px;width:100%;margin:0 auto;flex:1}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap}
.page-title{font-size:23px;font-weight:700}
.page-sub{color:var(--ink-3);font-size:13px;margin-top:3px}
.view{display:none}
.view.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* cards / grid */
.grid{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line-2)}
.card-head h3{font-size:14px}
.muted{color:var(--ink-3)}
.tiny{font-size:11.5px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow)}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between}
.kpi .k-ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2)}
.kpi .k-ico svg{width:17px;height:17px;color:var(--ink-2)}
.kpi .k-val{font-size:26px;font-weight:700;margin-top:11px;letter-spacing:-.02em}
.kpi .k-lbl{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.kpi .k-delta{font-size:11.5px;font-weight:600;margin-top:8px;display:inline-flex;align-items:center;gap:4px}
.k-delta.up{color:var(--ok)} .k-delta.down{color:var(--risk)}

/* badges / pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill .d{width:6px;height:6px;border-radius:50%}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.ok .d{background:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.warn .d{background:var(--warn)}
.pill.risk{background:var(--risk-soft);color:var(--risk)} .pill.risk .d{background:var(--risk)}
.pill.info{background:var(--info-soft);color:var(--info)} .pill.info .d{background:var(--info)}
.pill.ai{background:var(--ai-soft);color:var(--ai)} .pill.ai .d{background:var(--ai)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)} .pill.neutral .d{background:var(--ink-3)}
.sim-tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--info);
  background:var(--info-soft);border:1px solid #cedcec;border-radius:6px;padding:2px 7px}
.sim-tag svg{width:11px;height:11px}
.live-tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--ok);
  background:var(--ok-soft);border:1px solid #bfe0cd;border-radius:6px;padding:2px 7px}

/* tables */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
  font-weight:600;padding:11px 16px;border-bottom:1px solid var(--line-2)}
td{padding:13px 16px;border-bottom:1px solid var(--line-2);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--surface-2)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}

/* progress / timeline */
.bar{height:7px;border-radius:20px;background:var(--line-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:20px;background:var(--accent)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 18px 26px}
.timeline li:before{content:"";position:absolute;left:6px;top:3px;width:11px;height:11px;border-radius:50%;
  background:var(--surface);border:2px solid var(--line)}
.timeline li:after{content:"";position:absolute;left:11px;top:14px;bottom:0;width:2px;background:var(--line-2)}
.timeline li:last-child:after{display:none}
.timeline li.done:before{background:var(--ok);border-color:var(--ok)}
.timeline li.active:before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.timeline li.pending{opacity:.55}
.tl-title{font-weight:600;font-size:13px}
.tl-meta{font-size:11.5px;color:var(--ink-3)}

/* product tiles */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:transform .14s,box-shadow .14s}
.prod:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.prod .img{aspect-ratio:3/4;position:relative}
.prod .img svg{width:100%;height:100%;display:block}
.prod .meta{padding:12px 13px}
.prod .pname{font-weight:600;font-size:13.5px}
.prod .pcat{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.prod .pprice{font-weight:700;font-size:13.5px;margin-top:7px}

/* chat / inbox */
.inbox{display:grid;grid-template-columns:320px 1fr 300px;height:calc(100vh - 150px);min-height:560px;
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.conv-list{border-right:1px solid var(--line-2);overflow-y:auto}
.conv-search{padding:12px;border-bottom:1px solid var(--line-2)}
.conv-search input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12.5px;outline:none}
.conv{padding:13px 15px;border-bottom:1px solid var(--line-2);cursor:pointer;display:flex;gap:11px;transition:background .1s}
.conv:hover{background:var(--surface-2)}
.conv.active{background:var(--brand-soft)}
.conv .c-main{flex:1;min-width:0}
.conv .c-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.conv .c-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .c-time{font-size:10.5px;color:var(--ink-3);flex:none}
.conv .c-prev{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.conv .c-foot{display:flex;gap:6px;margin-top:7px;align-items:center}
.chan-ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff}
.chan-ico svg{width:14px;height:14px}
.chan-wa{background:#1fab54}
.chan-web{background:var(--info)}
.chan-ig{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888)}
.chat{display:flex;flex-direction:column;min-width:0}
.chat-head{padding:13px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:11px}
.chat-body{flex:1;overflow-y:auto;padding:18px;background:var(--surface-2);display:flex;flex-direction:column;gap:12px}
.msg{max-width:74%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.5;position:relative}
.msg .m-time{font-size:10px;color:var(--ink-3);margin-top:5px}
.msg.in{align-self:flex-start;background:var(--surface);border:1px solid var(--line-2);border-bottom-left-radius:4px}
.msg.out{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.out .m-time{color:rgba(255,255,255,.65)}
.msg.ai-suggest{align-self:flex-end;background:var(--ai-soft);border:1px dashed #c3b9e0;color:var(--ink);max-width:82%}
.msg.note{align-self:center;background:var(--warn-soft);color:var(--warn);font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:20px}
.chat-foot{border-top:1px solid var(--line-2);padding:12px 14px;background:var(--surface)}
.ai-draft{background:var(--ai-soft);border:1px solid #d6cdee;border-radius:11px;padding:11px 13px;margin-bottom:10px}
.ai-draft .adt{font-size:11px;font-weight:700;color:var(--ai);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.compose{display:flex;gap:9px;align-items:flex-end}
.compose textarea{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13px;resize:none;outline:none;min-height:42px;max-height:120px}
.ctx{border-left:1px solid var(--line-2);overflow-y:auto;padding:16px}
.ctx h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:18px 0 9px}
.ctx h4:first-child{margin-top:0}
.ctx .row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:4px 0}
.ctx .row .l{color:var(--ink-3)}
.typing{display:inline-flex;gap:3px;align-items:center}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--ai);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* calls */
.call-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line-2);cursor:pointer}
.call-row:hover{background:var(--surface-2)}
.call-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.call-ico svg{width:16px;height:16px}
.call-missed{background:var(--risk-soft);color:var(--risk)}
.call-done{background:var(--ok-soft);color:var(--ok)}
.call-after{background:var(--warn-soft);color:var(--warn)}

/* workflow */
.wf{display:flex;align-items:center;gap:15px;padding:16px 18px;border-bottom:1px solid var(--line-2)}
.wf:last-child{border-bottom:0}
.wf .wf-ico{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.wf .wf-ico svg{width:19px;height:19px}
.wf .wf-main{flex:1}
.wf .wf-name{font-weight:600;font-size:13.5px}
.wf .wf-desc{font-size:12px;color:var(--ink-3);margin-top:2px}
.wf .wf-flow{font-size:11.5px;color:var(--ink-2);margin-top:6px}
.wf .wf-flow b{color:var(--ink)}
.toggle{width:42px;height:24px;border-radius:20px;background:var(--line);position:relative;border:0;transition:background .15s;flex:none}
.toggle:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.toggle.on{background:var(--ok)} .toggle.on:after{left:20px}

/* charts */
.chart-wrap{padding:10px 6px 4px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}

/* scenario launcher */
.drawer-overlay{position:fixed;inset:0;background:rgba(25,22,18,.42);backdrop-filter:blur(2px);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:440px;max-width:94vw;background:var(--surface);
  box-shadow:var(--shadow-lg);z-index:91;transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.drawer-body{overflow-y:auto;padding:18px 22px;flex:1}
.scn{border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px;transition:border .12s,box-shadow .12s}
.scn:hover{border-color:#cfc9c0;box-shadow:var(--shadow)}
.scn .scn-top{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.scn .scn-num{width:24px;height:24px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.scn .scn-title{font-weight:600;font-size:13.5px}
.scn .scn-desc{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.scn .scn-biz{font-size:11.5px;color:var(--ink-3);margin:8px 0 11px;padding-left:11px;border-left:2px solid var(--accent-soft)}
.iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:16px;height:16px}

/* order detail drawer reuse */
.od-section{margin-bottom:22px}
.od-section h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:11px}
.meas-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 18px}
.meas-grid .m{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line-2)}
.meas-grid .m .l{color:var(--ink-3)}

/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line-2)}
.set-row:last-child{border:0}
.set-row .l{font-size:13.5px;font-weight:500}
.set-row .d{font-size:12px;color:var(--ink-3);margin-top:2px}
.swatch{width:26px;height:26px;border-radius:7px;border:1px solid rgba(0,0,0,.08)}
input[type=text].field,select.field{border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:13px;font-family:inherit;outline:none;background:var(--surface)}
input[type=text].field:focus{border-color:#c9c3ba;box-shadow:0 0 0 3px var(--brand-soft)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:11px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);z-index:120;opacity:0;
  transition:opacity .2s,transform .2s;display:flex;align-items:center;gap:9px;max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:16px;height:16px;flex:none}
.hl{animation:hl 1.6s ease}
@keyframes hl{0%,100%{box-shadow:var(--shadow)}30%{box-shadow:0 0 0 3px var(--accent)}}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:500;transition:all .12s}
.chip:hover{border-color:#cfc9c0}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}

@media(max-width:1100px){
  .inbox{grid-template-columns:280px 1fr}.ctx{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;z-index:100;transform:translateX(-100%);transition:transform .22s;width:248px}
  .sidebar.open{transform:none}
  .menu-btn{display:grid!important}
  .inbox{grid-template-columns:1fr}.conv-list{display:block}
  .inbox.show-chat .conv-list{display:none}
}

  const p=palettes[seed%palettes.length];
  const bg=`<defs><linearGradient id="g${seed}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient></defs>
      <rect width="300" height="400" fill="url(#g${seed})"/>

  const c=p[2];

    case "gown": g=`<path d="M150 70 L130 95 L120 130 Q100 300 95 350 L205 350 Q200 300 180 130 L170 95 Z" fill="${c}" opacity=".9"/>

    case "suit": g=`<path d="M150 74 L122 90 L112 150 L124 320 L176 320 L188 150 L178 90 Z" fill="${c}"/>
      <path d="M150 90 L134 150 L150 180 L166 150 Z" fill="#fff" opacity=".85"/>

      <rect x="130" y="150" width="40" height="110" fill="#fff" opacity=".12"/>`;
  }
  return `data:image/svg+xml;utf8,`+encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">${bg}${g}</svg>`);
}

function aiAssist(id){
  const c=CONVERSATIONS.find(x=>x.id===id);
  const foot=document.querySelector(".chat-foot");if(!foot)return;
  if(document.getElementById("aiDraft")){toast("AI draft already shown above");return;}
  const draftText=c.aiDraft||"Thanks for reaching out! Let me pull that up for you right away. One moment…";
  const div=document.createElement("div");div.className="ai-draft";div.id="aiDraft";div.style.opacity=0;
  div.innerHTML=`<div class="adt"><span class="typing"><i></i><i></i><i></i></span> AI is drafting a reply…</div>`;
  foot.insertBefore(div,foot.firstChild);
  requestAnimationFrame(()=>{div.style.transition="opacity .2s";div.style.opacity=1;});
  setTimeout(()=>{div.innerHTML=`<div class="adt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">${ICO2.bot}</svg>AI suggested reply · review before sending</div>
    <div style="font-size:13px;line-height:1.5">${draftText}</div>
    <div style="display:flex;gap:8px;margin-top:11px"><button class="btn primary sm" onclick="sendDraft('${id}')">Approve &amp; send</button>
    <button class="btn sm" onclick="regenDraft()">Regenerate</button></div>`;},1300);
}
function regenDraft(){toast("Regenerating a fresh AI draft… (simulated)");}
function sendDraft(id){
  const c=CONVERSATIONS.find(x=>x.id===id);
  const txt=c.aiDraft||document.querySelector("#aiDraft div:nth-child(2)")?.textContent||"Thanks!";
  pushMsg(id,{s:"out",t:txt,time:nowTime(),ai:true});
  c.aiDraft=null;if(c.status==="needs-human")c.status="ai-handled";
  document.getElementById("aiDraft")?.remove();
  openConv(id);renderNav();toast("Reply sent via "+(c.channel==='whatsapp'?'WhatsApp':c.channel));
}
function sendTyped(id){
  const box=document.getElementById("composeBox");if(!box.value.trim())return;
  pushMsg(id,{s:"out",t:box.value.trim(),time:nowTime()});box.value="";
  const cb=document.getElementById("chatBody");cb.scrollTop=cb.scrollHeight;
}
function pushMsg(id,m){CONVERSATIONS.find(x=>x.id===id).messages.push(m);
  const cb=document.getElementById("chatBody");if(cb){cb.insertAdjacentHTML("beforeend",renderMsg(m));cb.scrollTop=cb.scrollHeight;}}
function handoff(id){const c=CONVERSATIONS.find(x=>x.id===id);c.status="escalated";

    return `<li class="${cls}"><div class="tl-title">${s}</div><div class="tl-meta">${meta}</div></li>`;}).join("");

  drawerCustom(`${o.id} · ${o.product}`,`

      <div><div style="font-weight:600;font-size:13px;color:var(--${o.risk==='risk'?'risk':'warn'})">${o.risk==='risk'?'Delay detected — action needed':'Timeline is tight'}</div>
      <div class="tiny" style="color:var(--ink-2);margin-top:3px">${o.delay||'Monitor closely to stay on schedule.'} The ops team has been alerted and a proactive customer message is drafted.</div></div></div>`:''}

  renderRecs(PRODUCTS.slice(0,4),"Popular picks");};
function shopAsk(q){document.getElementById("shopInput").value=q;shopSend();}
function shopSend(){const i=document.getElementById("shopInput");const v=i.value.trim();if(!v)return;
  shopUser(v);i.value="";setTimeout(()=>shopRespond(v),650);}
function shopUser(t){const b=document.getElementById("shopBody");if(!b)return;
  b.insertAdjacentHTML("beforeend",`<div class="msg out">${t}</div>`);b.scrollTop=b.scrollHeight;}
function shopBot(t,products){const b=document.getElementById("shopBody");if(!b)return;
  const typing=`<div class="msg in" id="st"><span class="typing"><i></i><i></i><i></i></span></div>`;
  b.insertAdjacentHTML("beforeend",typing);b.scrollTop=b.scrollHeight;
  setTimeout(()=>{const b2=document.getElementById("shopBody");if(!b2)return;document.getElementById("st")?.remove();
    b2.insertAdjacentHTML("beforeend",`<div class="msg in">${t}</div>`);
    if(products&&products.length){
      b2.insertAdjacentHTML("beforeend",`<div class="msg in" style="max-width:88%;padding:8px">${products.map(p=>miniProd(p)).join("")}</div>`);}
    b2.scrollTop=b2.scrollHeight;},700);}
function miniProd(p){return `<div style="display:flex;gap:10px;align-items:center;padding:7px;border-radius:10px;cursor:pointer" onclick="go('shop')">
  <img src="${garmentSVG(p.type,p.seed)}" style="width:46px;height:60px;border-radius:7px;object-fit:cover"/>
  <div><div style="font-weight:600;font-size:12.5px">${p.name}</div><div class="tiny muted">${p.fabric} · ${p.occasion}</div><div style="font-weight:700;font-size:12.5px;margin-top:2px">from ${money(p.price)}</div></div></div>`;}
function shopRespond(q){
  q=q.toLowerCase();let picks=[],msg="",note="";
  const match=tags=>PRODUCTS.filter(p=>tags.some(t=>p.tags.includes(t)||p.cat.toLowerCase().includes(t)||p.occasion.toLowerCase().includes(t)));
  if(/budget|under|\$|cheap|affordable|400|300|500/.test(q)){
    const cap=parseInt((q.match(/\d{3}/)||[400])[0]);picks=PRODUCTS.filter(p=>p.price<=cap).slice(0,3);
    msg=`Here are beautiful options under ${money(cap)}. Each can be made to measure. Would you like to see fabric details or book a styling consult?`;note="Filtered by budget";}
  else if(/wedding guest|guest/.test(q)){picks=match(["eveningwear","reception","party","festive"]).slice(0,3);
    msg="For a wedding guest, these are elegant without upstaging the couple. What's your size and budget so I can refine?";note="Occasion: wedding guest";}
  else if(/sherwani|groom|men|suit|blazer/.test(q)){picks=match(["menswear","formalwear","sherwani","suit"]).slice(0,3);
    msg="Great menswear choices! Our Embroidered Sherwani is our most popular groom piece. Shall I check availability for your wedding date?";note="Menswear";}
  else if(/bridal|bride|lehenga/.test(q)){picks=match(["bridal","lehenga"]).concat(match(["festive"])).slice(0,3);
    msg="Congratulations on your wedding! 💍 Our bridal pieces are fully custom. These take 8–10 weeks — when is your big day? I can check the timeline.";note="Bridal";}
  else if(/gala|black.?tie|evening|formal|gown/.test(q)){picks=match(["eveningwear","gown","evening"]).slice(0,3);
    msg="For black-tie, these eveningwear pieces are perfect. What size should I check, and do you have a colour preference?";note="Eveningwear";}
  else if(/size|measure|fit/.test(q)){picks=PRODUCTS.slice(0,3);
    msg="We offer standard sizing and full made-to-measure. For custom, we'll collect your measurements over WhatsApp. Which piece caught your eye?";note="Sizing";}
  else if(/fabric|silk|material|velvet/.test(q)){picks=match(["silk","velvet"]).slice(0,3);
    msg="We work with pure silk, raw silk, velvet, georgette and Italian wool. Natural fabrics breathe beautifully. Any occasion in mind?";note="Fabric enquiry";}
  else{picks=PRODUCTS.slice(0,3);
    msg="I'd love to help you find the perfect piece! Could you tell me the occasion, your size, and a rough budget?";note="Discovery";}
  shopBot(msg,picks);
  if(picks.length)renderRecs(picks,note);
}
function renderRecs(list,note){
  const grid=document.getElementById("recGrid");if(!grid)return;
  document.getElementById("recNote").textContent=note||"AI updates these as the chat progresses";
  grid.innerHTML=list.map(p=>`<div class="prod">
    <div class="img"><img src="${garmentSVG(p.type,p.seed)}"/></div>
    <div class="meta"><div class="pname">${p.name}</div><div class="pcat">${p.fabric} · ${p.occasion}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
        <span class="pprice">from ${money(p.price)}</span><span class="tiny muted">${p.sizes}</span></div></div></div>`).join("");
}

      <div><div style="font-size:22px;font-weight:700">19</div><div class="tiny muted">after-hours leads kept</div></div>
      <div><div style="font-size:22px;font-weight:700">~${money(9400)}</div><div class="tiny muted">pipeline protected*</div></div>
    </div></div>
  <p class="tiny muted" style="margin-top:10px">*Illustrative sample figure for demonstration only. Not a guarantee or a record of actual sales.</p>`;
function barChart(){
  const d=ANALYTICS.daily,r=ANALYTICS.resolved,max=Math.max(...d)*1.1,W=620,H=200,n=d.length,bw=W/n;
  let bars="";
  for(let i=0;i<n;i++){
    const h1=d[i]/max*H,h2=r[i]/max*H,x=i*bw+bw*0.18,w=bw*0.64;
    bars+=`<rect x="${x}" y="${H-h1}" width="${w}" height="${h1}" rx="3" fill="var(--accent)" opacity=".28"/>
      <rect x="${x}" y="${H-h2}" width="${w}" height="${h2}" rx="3" fill="var(--ai)"/>`;}
  return `<svg viewBox="0 0 ${W} ${H+22}" style="width:100%;height:auto">${bars}
    <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--line)" stroke-width="1"/>
    <text x="2" y="${H+16}" font-size="10" fill="var(--ink-3)">14 days ago</text>
    <text x="${W-34}" y="${H+16}" font-size="10" fill="var(--ink-3)">today</text></svg>`;
}
function donut(){
  const data=ANALYTICS.channelMix,total=data.reduce((a,b)=>a+b.v,0);let off=0,segs="";
  const R=58,C=2*Math.PI*R;
  data.forEach(d=>{const frac=d.v/total,len=frac*C;
    segs+=`<circle cx="80" cy="80" r="${R}" fill="none" stroke="${d.c}" stroke-width="22"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`;off+=len;});
  const legend=data.map(d=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line-2)">
    <span style="display:flex;align-items:center;gap:8px;font-size:12.5px"><i style="width:10px;height:10px;border-radius:3px;background:${d.c};display:inline-block"></i>${d.l}</span>
    <b style="font-size:12.5px">${d.v}%</b></div>`).join("");
  return `<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center">
    <svg viewBox="0 0 160 160" style="width:150px;height:150px">${segs}
      <text x="80" y="76" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">4</text>
      <text x="80" y="94" text-anchor="middle" font-size="10" fill="var(--ink-3)">channels</text></svg>
    <div style="flex:1;min-width:150px">${legend}</div></div>`;
}
