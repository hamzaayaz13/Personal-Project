<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split the bill · talabat concept</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1a1a1a}
a{color:#f2f2f2}a:hover{color:#ffffff}

/* lines above the orb: letters arrive from a blur, one after another */
.ln{position:absolute;left:0;right:0;top:0;display:flex;flex-wrap:wrap;justify-content:center;column-gap:.28em;transition:opacity .45s ease,filter .45s ease,transform .45s ease}
.ln.off{opacity:0;filter:blur(10px);transform:translateY(-8px)}
.ln .w{display:inline-flex;white-space:nowrap}
.ln .c{opacity:0;filter:blur(10px)}
.ln.on .c{animation:chIn .55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes chIn{to{opacity:1;filter:blur(0)}}

/* the orb */
.orb{transition:opacity .9s ease,transform 1.1s cubic-bezier(.6,-.3,.4,1.4),filter .9s ease}
.orb.away{opacity:0;transform:scale(.55);filter:blur(6px)}

/* start */
.go{font:inherit;font-size:18px;font-weight:500;letter-spacing:.01em;color:#ffffff;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.55);border-radius:999px;padding:15px 34px;min-height:52px;cursor:pointer;transition:opacity .4s ease,background .2s ease,border-color .2s ease;animation:goBreathe 2.2s ease-in-out infinite,goRing 2.2s ease-out infinite}
.go:hover{background:rgba(255,255,255,.14);border-color:#ffffff}
@keyframes goBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes goRing{0%{box-shadow:0 0 0 0 rgba(255,138,76,.55),0 0 24px rgba(255,138,76,.25)}70%{box-shadow:0 0 0 18px rgba(255,138,76,0),0 0 34px rgba(255,138,76,.35)}100%{box-shadow:0 0 0 18px rgba(255,138,76,0),0 0 24px rgba(255,138,76,.25)}}
@media (prefers-reduced-motion: reduce){.go{animation:none}}
.go.hide{opacity:0;pointer-events:none}

/* the distortion wave (Libraries.dev's DistortionWavesKit, center type, ported to WebGL) */
.wave{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0}
.wave.on{opacity:1}

/* the film */
.film{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0e0b12;opacity:0;pointer-events:none}
.film.on{opacity:1;pointer-events:auto}
.film video{width:100%;height:100%;object-fit:contain;background:#0e0b12}
@media (prefers-reduced-motion: reduce){.ln.on .c{animation-duration:.01s}.orb{transition:none}}

html,body{height:100%}
.stage{position:relative;width:100%;height:100vh;height:100dvh;min-height:520px;overflow:hidden;background:#1a1a1a;font-family:'Figtree',system-ui,sans-serif;color:#f2f2f2}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;padding:16px;box-sizing:border-box}
.caps{position:relative;width:100%;max-width:980px;height:3.7em;font-size:clamp(22px,3vw,40px);font-weight:300;letter-spacing:-0.02em;line-height:1.2;text-align:center}
#orb{display:flex;align-items:center;justify-content:center;min-width:200px;min-height:200px}
</style>
